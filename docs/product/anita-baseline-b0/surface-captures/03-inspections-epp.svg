<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Captura sintética de Inspecciones y EPP</title><desc id="desc">Wireframe documental, no screenshot de producción.</desc>
