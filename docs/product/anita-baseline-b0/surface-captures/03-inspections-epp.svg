  <rect x="730" y="36" width="420" height="570" rx="12" fill="#fff" stroke="#d7dfe5"/><text x="764" y="76" fill="#14202b" font-family="sans-serif" font-size="19" font-weight="700">EPP · selección humana</text><text x="764" y="111" fill="#647482" font-family="sans-serif" font-size="14">Cargo: auxiliar de limpieza</text><g font-family="sans-serif" font-size="14"><text x="764" y="164" fill="#647482">Candidatos deterministas</text><rect x="764" y="182" width="352" height="54" rx="7" fill="#eaf2f8"/><text x="784" y="215" fill="#1e5f88">Guante nitrilo · seleccionado</text><rect x="764" y="254" width="352" height="54" rx="7" fill="#f1f4f6"/><text x="784" y="287" fill="#647482">Protección ocular · revisar</text><text x="764" y="356" fill="#647482">Trazabilidad</text><text x="764" y="390" fill="#14202b">Entrega · condición · reemplazo</text><text x="764" y="428" fill="#647482">Agregados</text><text x="764" y="462" fill="#14202b">1 pendiente · 0 autoactivaciones</text><text x="764" y="548" fill="#647482">CAPTURA SINTÉTICA · sin datos personales</text></g>
