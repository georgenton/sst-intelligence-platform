services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sst
      POSTGRES_USER: sst
      POSTGRES_PASSWORD: sst
    ports:
      - '5448:5432'
    volumes:
      - sst_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sst -d sst']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sst_postgres_data:
